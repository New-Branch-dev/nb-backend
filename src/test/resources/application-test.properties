# Isolated test database on the same local Postgres container (dev DB is NOT touched)
spring.datasource.url=jdbc:postgresql://localhost:5433/newbranch_test
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.com.newbranch=INFO

# Isolated Redis logical DB (dev uses index 0)
spring.data.redis.database=1

# No real mail server needed - JavaMailSender is mocked in tests
spring.mail.host=localhost
spring.mail.port=3025
# Actuator's mail health check inspects JavaMailSenderImpl beans directly, which breaks when @MockBean replaces it
management.health.mail.enabled=false

# No real external API keys needed - OpenAiClient/S3Uploader are mocked in tests
openai.api-key=test-key
spring.cloud.aws.s3.bucket=test-bucket
spring.cloud.aws.region.static=ap-northeast-2

# Small limit so the "file too large" test case doesn't need a real 50MB upload
spring.servlet.multipart.max-file-size=10KB
spring.servlet.multipart.max-request-size=10KB

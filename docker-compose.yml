services:
  postgres:
    image: postgres:15-alpine
    container_name: newbranch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: newbranch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - newbranch-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    # fix: 1GB짜리 t2/t3.micro에서 세 컨테이너를 같이 띄울 때 하나가 메모리를 다 먹어서
    # 나머지가 OOM으로 죽는 걸 막기 위해 컨테이너별 상한을 명시 (siwon)
    deploy:
      resources:
        limits:
          memory: 200m

  redis:
    image: redis:7-alpine
    container_name: newbranch-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - newbranch-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 100m

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: newbranch-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/newbranch
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      SERVER_PORT: 8080
      LOG_LEVEL: INFO
      # fix: BasicBinder TRACE는 이메일/토큰 등 바인드 파라미터 값을 그대로 로그에 남겨서
      # 운영 컨테이너에서는 끄도록 명시 (siwon)
      HIBERNATE_SQL_LOG_LEVEL: WARN
      HIBERNATE_BINDER_LOG_LEVEL: WARN
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # fix: 배포 환경에서 Swagger가 실수로 켜지는 일이 없도록 명시적으로 false 고정 (siwon)
      SWAGGER_ENABLED: "false"
    ports:
      - "8080:8080"
    networks:
      - newbranch-network
    deploy:
      resources:
        limits:
          memory: 550m

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  newbranch-network:
    driver: bridge
